<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Breakout · 赛博打砖块</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#05060f; color:#00ffcc; font-family:'Courier New', monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  h1 { font-size:24px; letter-spacing:4px; text-shadow:0 0 12px #00ffcc; }
  #wrap { position:relative; border:2px solid #00ffcc; box-shadow:0 0 20px #00ffcc55; }
  canvas { display:block; background:#060913; cursor:none; }
  #hud { display:flex; gap:30px; font-size:14px; }
  #hud span { color:#ff2fa0; }
  #over { display:none; position:absolute; inset:0; background:#05060fcc; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; }
  #over.show { display:flex; }
  #over h2 { color:#ff2fa0; font-size:28px; text-shadow:0 0 16px #ff2fa0; }
  button { background:transparent; border:1px solid #00ffcc; color:#00ffcc; padding:8px 26px; font-family:inherit; font-size:14px; letter-spacing:2px; cursor:pointer; }
  button:hover { background:#00ffcc22; box-shadow:0 0 12px #00ffcc; }
  .keys { color:#8899bb; font-size:12px; }
</style>
</head>
<body>
  <h1>CYBER BREAKOUT</h1>
  <div id="hud"><span>得分 <b id="score">0</b></span><span>生命 <b id="lives">3</b></span></div>
  <div id="wrap">
    <canvas id="cv" width="480" height="480"></canvas>
    <div id="over"><h2 id="ovText">GAME OVER</h2><button onclick="start()">再来一局</button></div>
  </div>
  <div class="keys">鼠标 / 左右方向键 移动挡板 · 空格发球</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const COLS=8,ROWS=6,BRICK_W=W/COLS,BRICK_H=22;
const PAD_W=90,PAD_H=12,PAD_Y=H-30;
const R=7;
const colors=['#ff2fa0','#ff7a2f','#ffe32f','#00ffcc','#2fd6ff','#7a5aff'];
let bricks,pad,ball,ballLive,score,lives,over,keys={};
function start(){
  bricks=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    bricks.push({x:c*BRICK_W,y:26+r*BRICK_H,w:BRICK_W-4,h:BRICK_H-4,alive:true,color:colors[r%colors.length]});
  pad={x:W/2-PAD_W/2,y:PAD_Y,w:PAD_W,h:PAD_H};
  ball={x:W/2,y:PAD_Y-R-1,vx:0,vy:0};
  ballLive=false; score=0; lives=3; over=false;
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('over').classList.remove('show');
}
function fire(){
  if(!ballLive&&!over){ ball.vx=(Math.random()<0.5?-1:1)*3; ball.vy=-4.2; ballLive=true; }
}
function loop(){
  if(over) return;
  update(); draw(); requestAnimationFrame(loop);
}
function update(){
  if(keys.left) pad.x-=6;
  if(keys.right) pad.x+=6;
  pad.x=Math.max(0,Math.min(W-PAD_W,pad.x));
  if(!ballLive){ ball.x=pad.x+PAD_W/2; ball.y=PAD_Y-R-1; return; }
  ball.x+=ball.vx; ball.y+=ball.vy;
  if(ball.x<R||ball.x>W-R) ball.vx*=-1;
  if(ball.y<R) ball.vy*=-1;
  if(ball.y+R>=pad.y&&ball.y-R<=pad.y+pad.h&&ball.x>pad.x-R&&ball.x<pad.x+pad.w+R&&ball.vy>0){
    const hit=(ball.x-(pad.x+pad.w/2))/(pad.w/2);
    ball.vx=hit*4.5; ball.vy=-Math.abs(ball.vy);
    ball.y=pad.y-R-1;
  }
  for(const b of bricks){
    if(!b.alive) continue;
    if(ball.x+R>b.x&&ball.x-R<b.x+b.w&&ball.y+R>b.y&&ball.y-R<b.y+b.h){
      b.alive=false;
      score+=10; document.getElementById('score').textContent=score;
      const ox=(ball.x-b.x-b.w/2)/(b.w/2), oy=(ball.y-b.y-b.h/2)/(b.h/2);
      if(Math.abs(ox)>Math.abs(oy)) ball.vx*=-1; else ball.vy*=-1;
      break;
    }
  }
  if(bricks.every(b=>!b.alive)){
    document.getElementById('ovText').textContent='YOU WIN!';
    document.getElementById('over').classList.add('show'); over=true; return;
  }
  if(ball.y>H+R){
    lives--; document.getElementById('lives').textContent=lives;
    if(lives<=0){
      document.getElementById('ovText').textContent='GAME OVER';
      document.getElementById('over').classList.add('show'); over=true;
    } else ballLive=false;
  }
}
function draw(){
  ctx.fillStyle='#060913'; ctx.fillRect(0,0,W,H);
  for(const b of bricks){
    if(!b.alive) continue;
    ctx.shadowColor=b.color; ctx.shadowBlur=10; ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h); ctx.shadowBlur=0;
  }
  ctx.shadowColor='#00ffcc'; ctx.shadowBlur=14; ctx.fillStyle='#00ffcc';
  ctx.fillRect(pad.x,pad.y,pad.w,pad.h); ctx.shadowBlur=0;
  ctx.shadowColor='#ffffff'; ctx.shadowBlur=14; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,R,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
}
document.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect();
  pad.x=e.clientX-rect.left-PAD_W/2;
  pad.x=Math.max(0,Math.min(W-PAD_W,pad.x));
  if(!ballLive){ ball.x=pad.x+PAD_W/2; ball.y=PAD_Y-R-1; }
});
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); if(!over) fire(); return; }
  if(k==='arrowleft') keys.left=true;
  if(k==='arrowright') keys.right=true;
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft') keys.left=false;
  if(k==='arrowright') keys.right=false;
});
start(); loop();
</script>
</body>
</html>

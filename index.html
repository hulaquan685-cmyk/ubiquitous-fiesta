<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无处不在的嘉年华 · 小游戏合集</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#05060f; color:#00ffcc; font-family:'Courier New', monospace;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
  }
  h1 { font-size:30px; letter-spacing:6px; text-shadow:0 0 16px #00ffcc; }
  p.sub { color:#8899bb; font-size:13px; letter-spacing:2px; }
  .grid { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  a.card {
    width:220px; height:150px; border:2px solid #00ffcc55; color:#00ffcc;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    text-decoration:none; transition:.25s; background:#080b1a;
  }
  a.card:hover { border-color:#00ffcc; box-shadow:0 0 24px #00ffcc66; transform:translateY(-4px); }
  a.card .icon { font-size:30px; }
  a.card .name { font-size:18px; letter-spacing:3px; }
  a.card .desc { font-size:12px; color:#8899bb; }
</style>
</head>
<body>
  <h1>无处不在的嘉年华</h1>
  <p class="sub">NEO-ARCADE MINI GAMES · 不定期更新</p>
  <div class="grid">
    <a class="card" href="cyber-snake.html">
      <div class="icon">[S]</div>
      <div class="name">CYBER SNAKE</div>
      <div class="desc">赛博贪吃蛇 · 键盘操作</div>
    </a>
    <a class="card" href="cyber-breakout.html">
      <div class="icon">[B]</div>
      <div class="name">CYBER BREAKOUT</div>
      <div class="desc">赛博打砖块 · 鼠标操作</div>
    </a>
    <a class="card" href="cyber-tetris.html">
      <div class="icon">[T]</div>
      <div class="name">CYBER TETRIS</div>
      <div class="desc">赛博俄罗斯方块 · 键盘操作</div>
    </a>
    <a class="card" href="cyber-2048.html">
      <div class="icon">[2]</div>
      <div class="name">CYBER 2048</div>
      <div class="desc">数字合并 · 方向键滑动</div>
    </a>
    <a class="card" href="cyber-memory.html">
      <div class="icon">[M]</div>
      <div class="name">CYBER MEMORY</div>
      <div class="desc">记忆翻牌 · 点击配对</div>
    </a>
    <a class="card" href="cyber-ttt.html">
      <div class="icon">[X]</div>
      <div class="name">CYBER TIC-TAC-TOE</div>
      <div class="desc">井字棋 · 人机对战</div>
    </a>
    <a class="card" href="cyber-whack.html">
      <div class="icon">[W]</div>
      <div class="name">CYBER WHACK</div>
      <div class="desc">打地鼠 · 30秒限时</div>
    </a>
  </div>
</body>
</html>
